name: Deploy

on:
  push:
    branches: [main]

jobs:
  verify:
    name: Lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mining
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mining?schema=public
      # Dummy but schema-valid values — the integration tests never call
      # AWS/Ping for real, they just need config/env.ts to parse.
      JWT_SECRET: ci-only-placeholder-secret-32-characters-min
      PING_BASE_URL: http://localhost:3000/api/v1
      PING_API_KEY: ci-placeholder
      AWS_REGION: eu-north-1
      AWS_S3_BUCKET: ci-placeholder-bucket
      AWS_ACCESS_KEY_ID: ci-placeholder
      AWS_SECRET_ACCESS_KEY: ci-placeholder
      AWS_S3_PUBLIC_BASE_URL: https://ci-placeholder-bucket.s3.eu-north-1.amazonaws.com
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Test
        run: npm test -- --passWithNoTests

  deploy:
    name: Deploy to EC2
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy mining-api
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /var/www/mining-api
            git fetch origin main
            git reset --hard origin/main
            npm ci --ignore-scripts
            npx prisma generate
            npx prisma migrate deploy
            npx prisma db seed
            npm run build
            pm2 restart dahabi-sudan --update-env

            PORT="$(grep -m1 '^PORT=' .env 2>/dev/null | cut -d= -f2)"
            PORT="${PORT:-4000}"
            for attempt in $(seq 1 10); do
              if curl -sf "http://localhost:${PORT}/api/health" > /dev/null; then
                echo "Health check passed on attempt ${attempt}"
                exit 0
              fi
              echo "Health check attempt ${attempt} failed, retrying…"
              sleep 3
            done
            echo "mining-api did not become healthy after restart" >&2
            pm2 logs dahabi-sudan --lines 100 --nostream
            exit 1
